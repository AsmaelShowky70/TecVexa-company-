<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TECVEXA | تحويل إلى لوحة التحكم</title>
    <link rel="icon" type="image/jpeg" href="../logo.jpeg" />
    <script>
      (function() {
        var origin = window.location.origin;
        var pathname = window.location.pathname;
        // Remove /admin/ or /admin from end of pathname
        var basePath = pathname.replace(/\/admin\/?$/i, '') || '';
        var search = window.location.search;
        window.location.replace(origin + basePath + '/' + (search ? search + '&admin=true' : '#admin'));
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 1.25rem;
        margin: 0 0 8px 0;
        font-weight: 700;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>جاري الدخول إلى لوحة تحكم TECVEXA...</h2>
    <p>سيتم تحويلك تلقائياً خلال ثانية واحدة</p>
  </body>
</html>
